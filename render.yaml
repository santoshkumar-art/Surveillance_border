services:
  - type: web
    name: surveillance-border
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: surveillance-border-data
      mountPath: /var/lib/bss
      sizeGB: 10
    envVars:
      - key: BSS_SECRET_KEY
        generateValue: true
      - key: BSS_ADMIN_USERNAME
        value: officer
      - key: BSS_ADMIN_PASSWORD
        generateValue: true
      - key: BSS_ADMIN_FULL_NAME
        value: Border Control Officer
      - key: BSS_CORS_ORIGINS
        value: '*'
      - key: BSS_ENABLE_PLATE_OCR
        value: 'false'
      - key: BSS_WRITE_ANNOTATED_VIDEO
        value: 'true'
      - key: BSS_FRAME_STRIDE
        value: '5'
      - key: BSS_MAX_UPLOAD_MB
        value: '2048'
